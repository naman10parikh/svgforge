<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="563" viewBox="0 0 1600 563" preserveAspectRatio="xMidYMid meet" role="img" aria-label="A left-to-right pipeline of five steps for making a figure with svgforge. Spec: a Python file describes cards, bands and arrows, and text widths are measured, not guessed. Render: svgforge build writes one SVG per figure, and the same spec always gives the same bytes. Lint, marked as the gate: it fails text under 11 pixels, text outside the canvas, glyphs that render as boxes, and empty alt text. Look: the figure is rendered to PNG and read, to catch overlaps and clipping by eye. Commit: the SVG, INDEX.json and the gallery are committed together, and CI runs the build with --check so no figure goes stale. Under each step sits what it produces: figures/name.py, diagrams/name.svg, zero problems, name.png (not committed), and one commit. A curved arrow runs from Look back to Spec, labelled: fix the spec, never the SVG."><title>How a figure is made</title><desc>A left-to-right pipeline of five steps for making a figure with svgforge. Spec: a Python file describes cards, bands and arrows, and text widths are measured, not guessed. Render: svgforge build writes one SVG per figure, and the same spec always gives the same bytes. Lint, marked as the gate: it fails text under 11 pixels, text outside the canvas, glyphs that render as boxes, and empty alt text. Look: the figure is rendered to PNG and read, to catch overlaps and clipping by eye. Commit: the SVG, INDEX.json and the gallery are committed together, and CI runs the build with --check so no figure goes stale. Under each step sits what it produces: figures/name.py, diagrams/name.svg, zero problems, name.png (not committed), and one commit. A curved arrow runs from Look back to Spec, labelled: fix the spec, never the SVG.</desc><rect x="0" y="0" width="1600" height="563" fill="#fbfaf7"/><text x="44.0" y="74.0" font-family="Instrument Sans,Avenir Next,Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="30" fill="#1c1b18">How a figure is made</text><text x="44.0" y="100.0" font-family="Instrument Sans,Avenir Next,Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="14" fill="#5f5b53">Five steps from a spec to a committed SVG. Lint is the gate: a figure that fails it is never committed.</text><line x1="44.0" y1="129.9" x2="98.0" y2="129.9" stroke="#2f5d8a" stroke-width="2.6"/><rect x="44.0" y="165.9" width="1512.0" height="233.1" rx="16" fill="#f3f0e8" stroke="#e4e0d6" stroke-width="1.2"/><rect x="68.0" y="193.9" width="248.0" height="121.1" rx="12" fill="#ffffff" stroke="#cdc7ba" stroke-width="1.3"/><text x="83.0" y="221.3" font-family="Instrument Sans,Avenir Next,Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="14.5" fill="#1c1b18" font-weight="700">Spec</text><text x="83.0" y="241.3" font-family="Instrument Sans,Avenir Next,Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="12.5" fill="#5f5b53">A Python file describes cards, bands</text><text x="83.0" y="258.8" font-family="Instrument Sans,Avenir Next,Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="12.5" fill="#5f5b53">and arrows.</text><text x="83.0" y="276.3" font-family="Instrument Sans,Avenir Next,Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="12.5" fill="#5f5b53">Text widths are measured, not</text><text x="83.0" y="293.8" font-family="Instrument Sans,Avenir Next,Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="12.5" fill="#5f5b53">guessed.</text><line x1="322.0" y1="254.4" x2="357.2" y2="254.4" stroke="#6f6a61" stroke-width="1.6"/><path d="M 366.0,254.4 L 357.2,258.3 L 357.2,250.6 Z" fill="#6f6a61"/><rect x="137.8" y="337.0" width="108.3" height="24.5" rx="12.25" fill="none" stroke="#5f5b53" stroke-width="1.2"/><text x="192.0" y="352.5" font-family="Instrument Sans,Avenir Next,Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="11.5" fill="#5f5b53" font-weight="700" text-anchor="middle">figures/name.py</text><rect x="372.0" y="193.9" width="248.0" height="121.1" rx="12" fill="#ffffff" stroke="#cdc7ba" stroke-width="1.3"/><text x="387.0" y="221.3" font-family="Instrument Sans,Avenir Next,Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="14.5" fill="#1c1b18" font-weight="700">Render</text><text x="387.0" y="241.3" font-family="Instrument Sans,Avenir Next,Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="12.5" fill="#5f5b53">svgforge build writes one SVG per</text><text x="387.0" y="258.8" font-family="Instrument Sans,Avenir Next,Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="12.5" fill="#5f5b53">figure.</text><text x="387.0" y="276.3" font-family="Instrument Sans,Avenir Next,Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="12.5" fill="#5f5b53">The same spec always gives the same</text><text x="387.0" y="293.8" font-family="Instrument Sans,Avenir Next,Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="12.5" fill="#5f5b53">bytes.</text><line x1="626.0" y1="254.4" x2="661.2" y2="254.4" stroke="#6f6a61" stroke-width="1.6"/><path d="M 670.0,254.4 L 661.2,258.3 L 661.2,250.6 Z" fill="#6f6a61"/><rect x="432.1" y="337.0" width="127.9" height="24.5" rx="12.25" fill="none" stroke="#5f5b53" stroke-width="1.2"/><text x="496.0" y="352.5" font-family="Instrument Sans,Avenir Next,Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="11.5" fill="#5f5b53" font-weight="700" text-anchor="middle">diagrams/name.svg</text><rect x="676.0" y="193.9" width="248.0" height="121.1" rx="12" fill="#e4ecf4" stroke="#2f5d8a" stroke-width="1.9"/><text x="691.0" y="221.3" font-family="Instrument Sans,Avenir Next,Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="14.5" fill="#1e3f60" font-weight="700">Lint</text><text x="691.0" y="241.3" font-family="Instrument Sans,Avenir Next,Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="12.5" fill="#5f5b53">Fails text under 11px, text off the</text><text x="691.0" y="258.8" font-family="Instrument Sans,Avenir Next,Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="12.5" fill="#5f5b53">canvas, glyphs that render as boxes,</text><text x="691.0" y="276.3" font-family="Instrument Sans,Avenir Next,Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="12.5" fill="#5f5b53">and empty alt text.</text><rect x="865.8" y="203.9" width="46.2" height="19.0" rx="9.5" fill="#2f5d8a" opacity="0.9"/><text x="888.9" y="217.4" font-family="Instrument Sans,Avenir Next,Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="11" fill="#fbfaf7" font-weight="700" text-anchor="middle" letter-spacing="0.4">GATE</text><line x1="930.0" y1="254.4" x2="965.2" y2="254.4" stroke="#6f6a61" stroke-width="1.6"/><path d="M 974.0,254.4 L 965.2,258.3 L 965.2,250.6 Z" fill="#6f6a61"/><rect x="759.0" y="337.0" width="82.0" height="24.5" rx="12.25" fill="none" stroke="#2f5d8a" stroke-width="1.2"/><text x="800.0" y="352.5" font-family="Instrument Sans,Avenir Next,Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="11.5" fill="#2f5d8a" font-weight="700" text-anchor="middle">0 problems</text><rect x="980.0" y="193.9" width="248.0" height="121.1" rx="12" fill="#ffffff" stroke="#cdc7ba" stroke-width="1.3"/><text x="995.0" y="221.3" font-family="Instrument Sans,Avenir Next,Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="14.5" fill="#1c1b18" font-weight="700">Look</text><text x="995.0" y="241.3" font-family="Instrument Sans,Avenir Next,Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="12.5" fill="#5f5b53">Render it to PNG and read it.</text><text x="995.0" y="258.8" font-family="Instrument Sans,Avenir Next,Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="12.5" fill="#5f5b53">Overlaps and clipping are caught by</text><text x="995.0" y="276.3" font-family="Instrument Sans,Avenir Next,Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="12.5" fill="#5f5b53">eye.</text><line x1="1234.0" y1="254.4" x2="1269.2" y2="254.4" stroke="#6f6a61" stroke-width="1.6"/><path d="M 1278.0,254.4 L 1269.2,258.3 L 1269.2,250.6 Z" fill="#6f6a61"/><rect x="1024.6" y="337.0" width="158.9" height="24.5" rx="12.25" fill="none" stroke="#5f5b53" stroke-width="1.2"/><text x="1104.0" y="352.5" font-family="Instrument Sans,Avenir Next,Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="11.5" fill="#5f5b53" font-weight="700" text-anchor="middle">name.png, not committed</text><rect x="1284.0" y="193.9" width="248.0" height="121.1" rx="12" fill="#ffffff" stroke="#cdc7ba" stroke-width="1.3"/><text x="1299.0" y="221.3" font-family="Instrument Sans,Avenir Next,Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="14.5" fill="#1c1b18" font-weight="700">Commit</text><text x="1299.0" y="241.3" font-family="Instrument Sans,Avenir Next,Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="12.5" fill="#5f5b53">The SVG, INDEX.json and the gallery</text><text x="1299.0" y="258.8" font-family="Instrument Sans,Avenir Next,Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="12.5" fill="#5f5b53">go in together.</text><text x="1299.0" y="276.3" font-family="Instrument Sans,Avenir Next,Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="12.5" fill="#5f5b53">CI runs --check, so nothing goes stale.</text><rect x="1365.6" y="337.0" width="84.7" height="24.5" rx="12.25" fill="none" stroke="#5f5b53" stroke-width="1.2"/><text x="1408.0" y="352.5" font-family="Instrument Sans,Avenir Next,Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="11.5" fill="#5f5b53" font-weight="700" text-anchor="middle">one commit</text><path d="M 1104.0,373.0 C 1104.0,463.0 192.0,463.0 192.0,387.0" fill="none" stroke="#2f5d8a" stroke-width="1.6" stroke-dasharray="5 5"/><line x1="192.0" y1="389.0" x2="192.0" y2="381.8" stroke="#2f5d8a" stroke-width="1.6"/><path d="M 192.0,373.0 L 195.8,381.8 L 188.2,381.8 Z" fill="#2f5d8a"/><text x="648.0" y="465.0" font-family="Instrument Sans,Avenir Next,Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="12.5" fill="#2f5d8a" text-anchor="middle" font-style="italic">fix the spec, never the SVG</text><text x="44.0" y="507.0" font-family="Instrument Sans,Avenir Next,Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="12.5" fill="#6f6a61" font-style="italic">Every step is a command an agent can run. Nothing is drawn by hand.</text></svg>
