<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="961" viewBox="0 0 1600 961" preserveAspectRatio="xMidYMid meet" role="img" aria-label="A stack of five layers that make up a self-improving tool, read from top to bottom, resting on Git. Surfaces: how people and agents reach it, through the command line, an MCP server, skills, a plugin and an agent card. Engine: the deterministic core, where the same input always gives the same output: measure, wrap, place, render. Gates, the highlighted layer, marked nothing ships without them: checks that stop a bad result before anyone relies on it, namely lint, unit tests, golden tasks and a stale check. Memory: what it has learned, kept as rules it can search, in MEMORY.md, LEARNINGS.md and a BM25 search. Runtime: where it runs, away from your own machine, on a CI runner or an E2B sandbox, with a run log. A bracket on the right groups all five layers as one repository, versioned together. The base bar reads Git: every change is a commit you can revert."><title>A self-improving tool, layer by layer</title><desc>A stack of five layers that make up a self-improving tool, read from top to bottom, resting on Git. Surfaces: how people and agents reach it, through the command line, an MCP server, skills, a plugin and an agent card. Engine: the deterministic core, where the same input always gives the same output: measure, wrap, place, render. Gates, the highlighted layer, marked nothing ships without them: checks that stop a bad result before anyone relies on it, namely lint, unit tests, golden tasks and a stale check. Memory: what it has learned, kept as rules it can search, in MEMORY.md, LEARNINGS.md and a BM25 search. Runtime: where it runs, away from your own machine, on a CI runner or an E2B sandbox, with a run log. A bracket on the right groups all five layers as one repository, versioned together. The base bar reads Git: every change is a commit you can revert.</desc><rect x="0" y="0" width="1600" height="961" fill="#fbfaf7"/><text x="44.0" y="74.0" font-family="Instrument Sans,Avenir Next,Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="30" fill="#1c1b18">A self-improving tool, layer by layer</text><text x="44.0" y="100.0" font-family="Instrument Sans,Avenir Next,Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="14" fill="#5f5b53">Five layers in one repository. The gates are what make the rest safe to change.</text><line x1="44.0" y1="129.9" x2="98.0" y2="129.9" stroke="#2f5d8a" stroke-width="2.6"/><rect x="44.0" y="161.9" width="1302.0" height="116.7" rx="12" fill="#ffffff" stroke="#e4e0d6" stroke-width="1.1"/><path d="M 49.0,163.9 L 49.0,276.5" fill="none" stroke="#1c1b18" stroke-width="5.5"/><text x="70.0" y="195.6" font-family="Instrument Sans,Avenir Next,Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="16" fill="#1c1b18" font-weight="700">Surfaces</text><text x="70.0" y="217.1" font-family="Instrument Sans,Avenir Next,Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="13" fill="#1c1b18">How people and agents reach it.</text><rect x="70.0" y="246.5" width="99.5" height="24.5" rx="12.25" fill="none" stroke="#5f5b53" stroke-width="1.1"/><text x="119.8" y="262.0" font-family="Instrument Sans,Avenir Next,Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="11.5" fill="#5f5b53" text-anchor="middle">command line</text><rect x="177.5" y="246.5" width="88.0" height="24.5" rx="12.25" fill="none" stroke="#5f5b53" stroke-width="1.1"/><text x="221.5" y="262.0" font-family="Instrument Sans,Avenir Next,Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="11.5" fill="#5f5b53" text-anchor="middle">MCP server</text><rect x="273.5" y="246.5" width="50.3" height="24.5" rx="12.25" fill="none" stroke="#5f5b53" stroke-width="1.1"/><text x="298.7" y="262.0" font-family="Instrument Sans,Avenir Next,Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="11.5" fill="#5f5b53" text-anchor="middle">skills</text><rect x="331.8" y="246.5" width="56.4" height="24.5" rx="12.25" fill="none" stroke="#5f5b53" stroke-width="1.1"/><text x="360.0" y="262.0" font-family="Instrument Sans,Avenir Next,Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="11.5" fill="#5f5b53" text-anchor="middle">plugin</text><rect x="396.2" y="246.5" width="81.3" height="24.5" rx="12.25" fill="none" stroke="#5f5b53" stroke-width="1.1"/><text x="436.9" y="262.0" font-family="Instrument Sans,Avenir Next,Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="11.5" fill="#5f5b53" text-anchor="middle">agent card</text><rect x="44.0" y="292.5" width="1302.0" height="116.7" rx="12" fill="#ffffff" stroke="#e4e0d6" stroke-width="1.1"/><path d="M 49.0,294.5 L 49.0,407.2" fill="none" stroke="#1c1b18" stroke-width="5.5"/><text x="70.0" y="326.3" font-family="Instrument Sans,Avenir Next,Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="16" fill="#1c1b18" font-weight="700">Engine</text><text x="70.0" y="347.7" font-family="Instrument Sans,Avenir Next,Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="13" fill="#1c1b18">The deterministic core: the same input always gives the same output.</text><rect x="70.0" y="377.2" width="71.2" height="24.5" rx="12.25" fill="none" stroke="#5f5b53" stroke-width="1.1"/><text x="105.6" y="392.7" font-family="Instrument Sans,Avenir Next,Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="11.5" fill="#5f5b53" text-anchor="middle">measure</text><rect x="149.2" y="377.2" width="50.3" height="24.5" rx="12.25" fill="none" stroke="#5f5b53" stroke-width="1.1"/><text x="174.3" y="392.7" font-family="Instrument Sans,Avenir Next,Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="11.5" fill="#5f5b53" text-anchor="middle">wrap</text><rect x="207.5" y="377.2" width="53.0" height="24.5" rx="12.25" fill="none" stroke="#5f5b53" stroke-width="1.1"/><text x="234.0" y="392.7" font-family="Instrument Sans,Avenir Next,Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="11.5" fill="#5f5b53" text-anchor="middle">place</text><rect x="268.5" y="377.2" width="59.1" height="24.5" rx="12.25" fill="none" stroke="#5f5b53" stroke-width="1.1"/><text x="298.0" y="392.7" font-family="Instrument Sans,Avenir Next,Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="11.5" fill="#5f5b53" text-anchor="middle">render</text><rect x="44.0" y="423.2" width="1302.0" height="116.7" rx="12" fill="#e4ecf4" stroke="#e4e0d6" stroke-width="1.1"/><path d="M 49.0,425.2 L 49.0,537.9" fill="none" stroke="#2f5d8a" stroke-width="5.5"/><text x="70.0" y="457.0" font-family="Instrument Sans,Avenir Next,Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="16" fill="#2f5d8a" font-weight="700">Gates</text><text x="70.0" y="478.4" font-family="Instrument Sans,Avenir Next,Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="13" fill="#1c1b18">Checks that stop a bad result before anyone relies on it.</text><rect x="70.0" y="507.9" width="39.5" height="24.5" rx="12.25" fill="none" stroke="#2f5d8a" stroke-width="1.1"/><text x="89.8" y="523.4" font-family="Instrument Sans,Avenir Next,Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="11.5" fill="#2f5d8a" text-anchor="middle">lint</text><rect x="117.5" y="507.9" width="72.6" height="24.5" rx="12.25" fill="none" stroke="#2f5d8a" stroke-width="1.1"/><text x="153.8" y="523.4" font-family="Instrument Sans,Avenir Next,Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="11.5" fill="#2f5d8a" text-anchor="middle">unit tests</text><rect x="198.1" y="507.9" width="92.1" height="24.5" rx="12.25" fill="none" stroke="#2f5d8a" stroke-width="1.1"/><text x="244.1" y="523.4" font-family="Instrument Sans,Avenir Next,Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="11.5" fill="#2f5d8a" text-anchor="middle">golden tasks</text><rect x="298.2" y="507.9" width="84.7" height="24.5" rx="12.25" fill="none" stroke="#2f5d8a" stroke-width="1.1"/><text x="340.5" y="523.4" font-family="Instrument Sans,Avenir Next,Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="11.5" fill="#2f5d8a" text-anchor="middle">stale check</text><rect x="1135.4" y="436.2" width="196.6" height="20.0" rx="10" fill="none" stroke="#2f5d8a" stroke-width="1.2"/><text x="1233.7" y="450.2" font-family="Instrument Sans,Avenir Next,Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="11" fill="#2f5d8a" font-weight="700" text-anchor="middle" letter-spacing="0.4">NOTHING SHIPS WITHOUT THEM</text><rect x="44.0" y="553.9" width="1302.0" height="116.7" rx="12" fill="#ffffff" stroke="#e4e0d6" stroke-width="1.1"/><path d="M 49.0,555.9 L 49.0,668.5" fill="none" stroke="#1c1b18" stroke-width="5.5"/><text x="70.0" y="587.6" font-family="Instrument Sans,Avenir Next,Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="16" fill="#1c1b18" font-weight="700">Memory</text><text x="70.0" y="609.1" font-family="Instrument Sans,Avenir Next,Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="13" fill="#1c1b18">What it has learned, kept as rules it can search.</text><rect x="70.0" y="638.5" width="98.8" height="24.5" rx="12.25" fill="none" stroke="#5f5b53" stroke-width="1.1"/><text x="119.4" y="654.0" font-family="Instrument Sans,Avenir Next,Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="11.5" fill="#5f5b53" text-anchor="middle">MEMORY.md</text><rect x="176.8" y="638.5" width="114.3" height="24.5" rx="12.25" fill="none" stroke="#5f5b53" stroke-width="1.1"/><text x="234.0" y="654.0" font-family="Instrument Sans,Avenir Next,Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="11.5" fill="#5f5b53" text-anchor="middle">LEARNINGS.md</text><rect x="299.2" y="638.5" width="95.5" height="24.5" rx="12.25" fill="none" stroke="#5f5b53" stroke-width="1.1"/><text x="346.9" y="654.0" font-family="Instrument Sans,Avenir Next,Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="11.5" fill="#5f5b53" text-anchor="middle">BM25 search</text><rect x="44.0" y="684.5" width="1302.0" height="116.7" rx="12" fill="#ffffff" stroke="#e4e0d6" stroke-width="1.1"/><path d="M 49.0,686.5 L 49.0,799.2" fill="none" stroke="#1c1b18" stroke-width="5.5"/><text x="70.0" y="718.3" font-family="Instrument Sans,Avenir Next,Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="16" fill="#1c1b18" font-weight="700">Runtime</text><text x="70.0" y="739.7" font-family="Instrument Sans,Avenir Next,Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="13" fill="#1c1b18">Where it runs, away from your own machine.</text><rect x="70.0" y="769.2" width="74.6" height="24.5" rx="12.25" fill="none" stroke="#5f5b53" stroke-width="1.1"/><text x="107.3" y="784.7" font-family="Instrument Sans,Avenir Next,Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="11.5" fill="#5f5b53" text-anchor="middle">CI runner</text><rect x="152.6" y="769.2" width="96.2" height="24.5" rx="12.25" fill="none" stroke="#5f5b53" stroke-width="1.1"/><text x="200.7" y="784.7" font-family="Instrument Sans,Avenir Next,Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="11.5" fill="#5f5b53" text-anchor="middle">E2B sandbox</text><rect x="256.7" y="769.2" width="61.1" height="24.5" rx="12.25" fill="none" stroke="#5f5b53" stroke-width="1.1"/><text x="287.3" y="784.7" font-family="Instrument Sans,Avenir Next,Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="11.5" fill="#5f5b53" text-anchor="middle">run log</text><path d="M 1362.0,165.9 L 1374.0,165.9 L 1374.0,797.2 L 1362.0,797.2" fill="none" stroke="#5f5b53" stroke-width="1.4"/><text x="1386.0" y="472.5" font-family="Instrument Sans,Avenir Next,Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="11.5" fill="#5f5b53" font-weight="700" letter-spacing="0.8">ONE REPOSITORY</text><text x="1386.0" y="488.5" font-family="Instrument Sans,Avenir Next,Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="11" fill="#6f6a61">versioned</text><text x="1386.0" y="502.5" font-family="Instrument Sans,Avenir Next,Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="11" fill="#6f6a61">together</text><rect x="44.0" y="823.2" width="1512.0" height="46.0" rx="10" fill="none" stroke="#5f5b53" stroke-width="2"/><text x="66.0" y="851.2" font-family="Instrument Sans,Avenir Next,Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="14" fill="#5f5b53" font-weight="700">Git</text><text x="1534.0" y="851.2" font-family="Instrument Sans,Avenir Next,Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="12" fill="#5f5b53" text-anchor="end">every change is a commit you can revert</text><text x="44.0" y="905.2" font-family="Instrument Sans,Avenir Next,Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="12.5" fill="#6f6a61" font-style="italic">Read it top down: what you call, what computes, what checks, what remembers, where it runs.</text></svg>
