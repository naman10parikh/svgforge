<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="666" viewBox="0 0 1600 666" preserveAspectRatio="xMidYMid meet" role="img" aria-label="A loop of four steps drawn clockwise around its cadence, every night and on every push. Run the evals: tests, lint gates and golden tasks run on a fresh machine, and a failure is a finding too. An arrow labelled results leads to Find a gap: compare the results with the last run and look for what the rules still miss. An arrow labelled a finding leads to Propose a fix: write the change and the evidence for it, open an issue, never merge. An arrow labelled a proposal leads to A person reviews, marked as the gate: they merge what holds up and close what does not, and every change is a commit, so any step can be undone. An arrow labelled merged or closed leads back to Run the evals. A bar along the bottom says the loop proposes and a person decides: it never merges by itself."><title>An improvement loop</title><desc>A loop of four steps drawn clockwise around its cadence, every night and on every push. Run the evals: tests, lint gates and golden tasks run on a fresh machine, and a failure is a finding too. An arrow labelled results leads to Find a gap: compare the results with the last run and look for what the rules still miss. An arrow labelled a finding leads to Propose a fix: write the change and the evidence for it, open an issue, never merge. An arrow labelled a proposal leads to A person reviews, marked as the gate: they merge what holds up and close what does not, and every change is a commit, so any step can be undone. An arrow labelled merged or closed leads back to Run the evals. A bar along the bottom says the loop proposes and a person decides: it never merges by itself.</desc><rect x="0" y="0" width="1600" height="666" fill="#fbfaf7"/><text x="44.0" y="74.0" font-family="Instrument Sans,Avenir Next,Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="30" fill="#1c1b18">An improvement loop</text><text x="44.0" y="100.0" font-family="Instrument Sans,Avenir Next,Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="14" fill="#5f5b53">Four steps that repeat on a schedule. The loop proposes; a person decides.</text><line x1="44.0" y1="129.9" x2="98.0" y2="129.9" stroke="#2f5d8a" stroke-width="2.6"/><rect x="44.0" y="169.9" width="470.0" height="86.1" rx="12" fill="#ffffff" stroke="#cdc7ba" stroke-width="1.3"/><text x="59.0" y="197.3" font-family="Instrument Sans,Avenir Next,Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="14.5" fill="#1c1b18" font-weight="700">Run the evals</text><text x="59.0" y="217.3" font-family="Instrument Sans,Avenir Next,Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="12.5" fill="#5f5b53">Tests, lint gates and golden tasks run on a fresh machine.</text><text x="59.0" y="234.8" font-family="Instrument Sans,Avenir Next,Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="12.5" fill="#5f5b53">A failure is a finding too.</text><rect x="1086.0" y="169.9" width="470.0" height="86.1" rx="12" fill="#ffffff" stroke="#cdc7ba" stroke-width="1.3"/><text x="1101.0" y="197.3" font-family="Instrument Sans,Avenir Next,Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="14.5" fill="#1c1b18" font-weight="700">Find a gap</text><text x="1101.0" y="217.3" font-family="Instrument Sans,Avenir Next,Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="12.5" fill="#5f5b53">Compare the results with the last run.</text><text x="1101.0" y="234.8" font-family="Instrument Sans,Avenir Next,Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="12.5" fill="#5f5b53">Look for what the rules still miss.</text><rect x="1086.0" y="406.0" width="470.0" height="86.1" rx="12" fill="#ffffff" stroke="#cdc7ba" stroke-width="1.3"/><text x="1101.0" y="433.5" font-family="Instrument Sans,Avenir Next,Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="14.5" fill="#1c1b18" font-weight="700">Propose a fix</text><text x="1101.0" y="453.4" font-family="Instrument Sans,Avenir Next,Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="12.5" fill="#5f5b53">Write the change and the evidence for it.</text><text x="1101.0" y="470.9" font-family="Instrument Sans,Avenir Next,Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="12.5" fill="#5f5b53">Open an issue. Never merge.</text><rect x="44.0" y="406.0" width="470.0" height="86.1" rx="12" fill="#e4ecf4" stroke="#2f5d8a" stroke-width="1.9"/><text x="59.0" y="433.5" font-family="Instrument Sans,Avenir Next,Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="14.5" fill="#1e3f60" font-weight="700">A person reviews</text><text x="59.0" y="453.4" font-family="Instrument Sans,Avenir Next,Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="12.5" fill="#5f5b53">Merges what holds up and closes what does not.</text><text x="59.0" y="470.9" font-family="Instrument Sans,Avenir Next,Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="12.5" fill="#5f5b53">Every change is a commit, so any step can be undone.</text><rect x="455.8" y="416.0" width="46.2" height="19.0" rx="9.5" fill="#2f5d8a" opacity="0.9"/><text x="478.9" y="429.5" font-family="Instrument Sans,Avenir Next,Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="11" fill="#fbfaf7" font-weight="700" text-anchor="middle" letter-spacing="0.4">GATE</text><line x1="524.0" y1="212.9" x2="1067.2" y2="212.9" stroke="#6f6a61" stroke-width="1.6"/><path d="M 1076.0,212.9 L 1067.2,216.8 L 1067.2,209.1 Z" fill="#6f6a61"/><text x="800.0" y="205.9" font-family="Instrument Sans,Avenir Next,Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="11.5" fill="#6f6a61" text-anchor="middle">results</text><line x1="1321.0" y1="266.0" x2="1321.0" y2="387.3" stroke="#6f6a61" stroke-width="1.6"/><path d="M 1321.0,396.0 L 1317.2,387.3 L 1324.8,387.3 Z" fill="#6f6a61"/><text x="1333.0" y="335.0" font-family="Instrument Sans,Avenir Next,Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="11.5" fill="#6f6a61">a finding</text><line x1="1076.0" y1="449.1" x2="532.8" y2="449.1" stroke="#6f6a61" stroke-width="1.6"/><path d="M 524.0,449.1 L 532.8,445.2 L 532.8,452.9 Z" fill="#6f6a61"/><text x="800.0" y="442.1" font-family="Instrument Sans,Avenir Next,Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="11.5" fill="#6f6a61" text-anchor="middle">a proposal</text><line x1="279.0" y1="396.0" x2="279.0" y2="274.8" stroke="#6f6a61" stroke-width="1.6"/><path d="M 279.0,266.0 L 282.9,274.8 L 275.1,274.8 Z" fill="#6f6a61"/><text x="291.0" y="335.0" font-family="Instrument Sans,Avenir Next,Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="11.5" fill="#6f6a61">merged or closed</text><text x="800.0" y="327.0" font-family="Instrument Sans,Avenir Next,Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="24" fill="#1c1b18" text-anchor="middle">every night</text><text x="800.0" y="353.0" font-family="Instrument Sans,Avenir Next,Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="13" fill="#5f5b53" text-anchor="middle">and on every push</text><rect x="44.0" y="528.1" width="1512.0" height="46.0" rx="10" fill="none" stroke="#5f5b53" stroke-width="2"/><text x="66.0" y="556.1" font-family="Instrument Sans,Avenir Next,Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="14" fill="#5f5b53" font-weight="700">The loop proposes. A person decides.</text><text x="1534.0" y="556.1" font-family="Instrument Sans,Avenir Next,Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="12" fill="#5f5b53" text-anchor="end">it never merges by itself</text><text x="44.0" y="610.1" font-family="Instrument Sans,Avenir Next,Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="12.5" fill="#6f6a61" font-style="italic">The same shape fits any tool that carries its own evals.</text></svg>
