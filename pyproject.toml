[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "svgforge"
dynamic = ["version"]
description = "Diagrams as code: deterministic SVG figures with lint gates, drawn by agents."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Naman Parikh" }]
keywords = ["svg", "diagrams", "diagrams-as-code", "agent-native", "mcp", "claude-code", "agent-skills"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: Multimedia :: Graphics",
  "Topic :: Documentation",
]
dependencies = []

[project.optional-dependencies]
sandbox = ["e2b>=2"]

[project.scripts]
svgforge = "svgforge.cli:main"
svgforge-mcp = "svgforge.mcp_server:main"

[project.urls]
Homepage = "https://github.com/naman10parikh/svgforge"
Issues = "https://github.com/naman10parikh/svgforge/issues"

[tool.hatch.version]
path = "src/svgforge/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/svgforge"]
